# ----------------------------------------------------------------------------
# PERFILES DE MARCA
# ----------------------------------------------------------------------------
# Cada línea define los atributos iniciales (1-5) y el precio de partida.
# El atributo 6 (costo unitario) se calcula con la fórmula del escenario.
# ----------------------------------------------------------------------------
lineas:
  agua:
    composicion: 0
    porcion_ml: 90
    calidad_ingredientes: 45
    cremosidad: 25
    empaque: 45
    precio_inicial: 4.50
  mixto:
    composicion: 1
    porcion_ml: 120
    calidad_ingredientes: 62
    cremosidad: 55
    empaque: 60
    precio_inicial: 7.00
  crema:
    composicion: 2
    porcion_ml: 140
    calidad_ingredientes: 75
    cremosidad: 78
    empaque: 70
    precio_inicial: 9.50

# ----------------------------------------------------------------------------
# ATRIBUTOS DEL PRODUCTO (6)
# ----------------------------------------------------------------------------
# Los atributos 1-5 describen el helado y determinan el costo estándar.
# El atributo 6 es el costo unitario objetivo (Bs/unidad) que se persigue en I&D.
#
#   costo_estandar = costo_base
#                  + coef_composicion * composicion
#                  + coef_porcion     * porcion_ml
#                  + coef_calidad     * calidad
#                  + coef_cremosidad  * cremosidad
#                  + coef_empaque     * empaque
# ----------------------------------------------------------------------------
atributos:
  costo_base: 0.40
  unidad_costo: Bs_por_unidad
  lista:
    - numero: 1
      codigo: composicion
      nombre: Tipo de composición
      descripcion: "0 = base agua (paleta), 1 = mixto (leche y agua), 2 = crema"
      unidad: categoria
      minimo: 0
      maximo: 2
      entero: true
      coeficiente_costo: 0.35
      presupuesto_por_unidad: 900.0
      escala: "0 agua · 1 mixto · 2 crema"

    - numero: 2
      codigo: porcion_ml
      nombre: Tamaño de porción
      descripcion: "Volumen de la unidad de venta en mililitros"
      unidad: ml
      minimo: 60
      maximo: 250
      entero: false
      coeficiente_costo: 0.008
      presupuesto_por_unidad: 25.0

    - numero: 3
      codigo: calidad_ingredientes
      nombre: Calidad de ingredientes
      descripcion: "Índice 0-100 de calidad de la materia prima"
      unidad: indice_0_100
      minimo: 0
      maximo: 100
      entero: false
      coeficiente_costo: 0.015
      presupuesto_por_unidad: 22.0

    - numero: 4
      codigo: cremosidad
      nombre: Cremorosidad y textura
      descripcion: "Índice 0-100 de textura percibida"
      unidad: indice_0_100
      minimo: 0
      maximo: 100
      entero: false
      coeficiente_costo: 0.005
      presupuesto_por_unidad: 18.0

    - numero: 5
      codigo: empaque
      nombre: Empaque y conservación
      descripcion: "Índice 0-100 de calidad de empaque y cadena de frío"
      unidad: indice_0_100
      minimo: 0
      maximo: 100
      entero: false
      coeficiente_costo: 0.005
      presupuesto_por_unidad: 16.0

    - numero: 6
      codigo: costo_unitario
      nombre: Costo unitario objetivo
      descripcion: "Costo de producción por unidad que el proyecto de I&D persigue"
      unidad: Bs_por_unidad
      minimo: 1.00
      maximo: 9.00
      entero: false
      coeficiente_costo: 0.0
      presupuesto_por_unidad: 120.0

# Producto de referencia: valores con los que arranca toda marca nueva.
atributos_iniciales:
  1: 1
  2: 120
  3: 70
  4: 60
  5: 60
  6: 3.36

# ----------------------------------------------------------------------------
# PARÁMETROS DEL MOTOR
# ----------------------------------------------------------------------------
motor:
  # Atractivo: A = precio_fit * awareness^alpha * cobertura^delta
  #                * ajuste_producto * ruido
  precio_referencia_factor: 1.0     # se recalcula con el promedio del mercado
  exponente_publicidad_base: 0.40
  exponente_cobertura_base: 0.45
  sigma_calidad: 22.0               # desviación del ajuste gaussiano de calidad
  sigma_cremosidad: 25.0
  sigma_empaque: 30.0

  # Awareness: awareness = 1 - exp(-publicidad / escala_awareness)
  escala_awareness: 2000.0          # miles de Bs para ~63 % de recordación

  # Ruido determinista del atractivo (±4 %)
  ruido_minimo: 0.96
  ruido_maximo: 1.04
  semilla: mundo_markestrat_bolivia

  # Cobertura
  cobertura_minima: 0.02
  cobertura_maxima: 1.00
  vendedores_plenos: 20             # vendedores por canal para cobertura plena
  peso_detallistas: 0.60            # peso de la presencia en puntos de venta
  peso_vendedores: 0.40             # peso de la fuerza de ventas propia

  # Disponibilidad e inventario perecedero
  merma_anual_inventario: 0.18      # se pierde 18 % del inventario por año
  costo_almacenaje: 0.115           # del costo unitario sobre inventario final
  dias_ano: 360

  # Finanzas
  costo_fijo_por_marca: 300.0       # miles de Bs por año
  costo_vendedor: 30.6              # miles de Bs por vendedor y año
  margen_transferencia_defecto: 0.45  # si la marca no tiene costo propio
  presupuesto_inicial: 8000.0       # miles de Bs
  presupuesto_piso: 8000.0          # miles de Bs
  presupuesto_techo: 40000.0        # miles de Bs
  presupuesto_factor_contribucion: 0.30
  presupuesto_factor_ingresos: 0.0

  # Demanda no satisfecha: no se arrastra al año siguiente.
  arrastrar_demanda_insatisfecha: false


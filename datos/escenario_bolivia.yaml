# ============================================================================
# EL MUNDO DE MARKESTRAT BOLIVIA
# Escenario de simulación: industria de helados en Bolivia
# ============================================================================
#
# Este archivo es la ÚNICA fuente de verdad del escenario. El motor, los
# servicios, las semillas y las pruebas lo leen a través de `core/escenario.py`.
#
# Reglas de contenido
# -------------------
# Toda cifra macro declara cuatro campos obligatorios:
#   valor                : el número
#   unidad               : en qué se mide
#   naturaleza           : oficial | supuesto | ficticio
#   fuente               : de dónde sale (texto) o null si es supuesto
#   fecha                : año o fecha de la referencia
#   estado_verificacion  : verificado | pendiente
#
# `oficial`   = dato publicado por un organismo o empresa.
# `supuesto`  = decisión del ejercicio académico, no un dato observado.
# `ficticio`  = inventado para la simulación; no representa la realidad.
#
# NINGÚN valor `pendiente` debe presentarse como dato verificado en la interfaz.
#
# Unidades del motor (consistentes en todo el sistema)
# ----------------------------------------------------
#   mercado, demanda, producción disponible : unidades físicas
#   producción, ventas, inventario          : miles de unidades
#   precio                                  : Bs por unidad
#   publicidad, costos, contribución        : miles de Bs
# ----------------------------------------------------------------------------

meta:
  codigo: mundo_markestrat_bolivia
  nombre: El Mundo de Markestrat Bolivia
  version: 1.0.0
  industria: helados
  pais: Bolivia
  moneda: BOB
  simbolo_moneda: Bs
  anio_base: 0
  anios_maximos: 10
  descargo: >
    Simulación académica. Las empresas mencionadas existen en Bolivia, pero
    las marcas, los productos, las cifras de mercado y todos los resultados
    económicos de esta simulación son ficticios y no representan información
    real de esas empresas ni del mercado boliviano de helados.


# ----------------------------------------------------------------------------
# MERCADO POTENCIAL
# ----------------------------------------------------------------------------
# El tamaño del mercado NO se toma de una fuente: se construye con supuestos
# explícitos para que el ejercicio sea jugable con 5 empresas y 10 marcas.
#   poblacion * penetracion * frecuencia * unidades_por_compra
#   11.400.000 * 0,35 * 12 * 1,2 = 57.456.000  ->  redondeado a 57.500.000
# ----------------------------------------------------------------------------
mercado:
  mercado_potencial_base:
    valor: 57500000
    unidad: unidades_por_anio
    naturaleza: supuesto
    fuente: "Construcción del ejercicio con supuestos explícitos"
    fecha: "2026"
    estado_verificacion: no_aplica
    formula: "poblacion_total * penetracion_consumidores * frecuencia_anual * unidades_por_compra"
    nota: >
      Mercado anual de unidades de helado. Rango de diseño 40-60 millones de
      unidades al año. No es una cifra observada del mercado boliviano.

  penetracion_consumidores:
    valor: 0.35
    unidad: proporcion_de_la_poblacion
    naturaleza: supuesto
    fuente: "Supuesto del ejercicio académico"
    fecha: "2026"
    estado_verificacion: no_aplica

  frecuencia_anual:
    valor: 12
    unidad: compras_por_anio
    naturaleza: supuesto
    fuente: "Supuesto del ejercicio académico"
    fecha: "2026"
    estado_verificacion: no_aplica

  unidades_por_compra:
    valor: 1.2
    unidad: unidades_por_compra
    naturaleza: supuesto
    fuente: "Supuesto del ejercicio académico"
    fecha: "2026"
    estado_verificacion: no_aplica

  crecimiento_anual:
    valor: 0.02
    unidad: proporcion_anual
    naturaleza: supuesto
    fuente: "Supuesto del ejercicio académico (crecimiento del volumen)"
    fecha: "2026"
    estado_verificacion: no_aplica

# Pesos mensuales de consumo. Se normalizan al promedio 1,0 en el motor.

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PACHA - Sin Equipo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/alumno.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Dancing+Script:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body class="alumno-body">

    <header class="header">
        <div class="header-izq">
            <span class="logo-icono">⛰️</span>
            <span class="logo-texto">PACHA</span>
        </div>
        <div class="header-der">
            <div class="header-usuario">
                <div class="avatar">{{ nombre[0] if nombre else 'A' }}</div>
                <div class="datos">
                    <div class="nombre">{{ nombre }}</div>
                    <div class="rol">Alumno</div>
                </div>
            </div>
            <a href="{{ url_for('auth.logout') }}" class="btn-salir">SALIR</a>
        </div>
    </header>

    <div class="contenedor">

        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="{{ url_for('alumno.panel') }}" class="sidebar-item activo">
                    <span class="sidebar-icon">🏠</span>
                    <span class="sidebar-label">Inicio</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <p>© PACHA 2026</p>
                <p>v1.0</p>
            </div>
        </aside>

        <main class="main-contenido">
            <section class="seccion-reportes" style="text-align:center; padding: 80px 40px;">
                <div class="vacio-icono">👥</div>
                <h1 class="vacio-titulo">Sin equipo asignado</h1>
                <p class="vacio-texto">
                    Aún no te han asignado a un equipo.<br>
                    Contacta con tu profesor para que te incluya en una simulación.
                </p>
                <a href="{{ url_for('auth.logout') }}" class="btn-primario">CERRAR SESIÓN</a>
            </section>
        </main>

    </div>
  <!-- Toast notifications -->
    <script src="{{ url_for('static', filename='js/toast_alumno.js') }}"></script>
</body>
</html>
